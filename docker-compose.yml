services:
  postgres:
    image: postgres:17
    container_name: classroom-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: classroom_password
      POSTGRES_DB: classroom_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: