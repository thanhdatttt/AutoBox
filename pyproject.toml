[project]
name = "autobox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thanh Dat Pham", email = "tmaxzv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.54.0",
    "openai-agents>=0.20.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
autobox = "autobox.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autobox"]
